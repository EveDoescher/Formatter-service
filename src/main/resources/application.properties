spring.application.name=formatter-service

# LibreOffice post-processing — disabled by default
formatter.libreoffice.enabled=true
formatter.libreoffice.executable-path=/usr/bin/soffice
formatter.libreoffice.timeout-seconds=60

# Profile service HTTP provider (set via env var PROFILE_SERVICE_URL to activate)
# profile.service.url=http://profile-service:8082
# profile.service.connect-timeout-ms=3000
# profile.service.read-timeout-ms=10000
